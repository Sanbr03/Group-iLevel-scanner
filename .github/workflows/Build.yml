name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package addon
        id: package
        run: |
          BASE_VERSION=$(sed -n 's/^## Version: *//p' GroupILvlTooltip/GroupILvlTooltip.toc | tr -d '\r' | head -n 1)
          if [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            echo "TOC version must use MAJOR.MINOR; got '$BASE_VERSION'." >&2
            exit 1
          fi

          mkdir -p dist/GroupILvlTooltip
          cp GroupILvlTooltip/GroupILvlTooltip.lua GroupILvlTooltip/GroupILvlTooltip.toc dist/GroupILvlTooltip/
          sed -i "s/^## Version:.*/## Version: $VERSION/" dist/GroupILvlTooltip/GroupILvlTooltip.toc
          cd dist
          zip -r "GroupILvlTooltip-$VERSION.zip" GroupILvlTooltip
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.package.outputs.version }}
          generate_release_notes: true
          prerelease: true
          overwrite_files: true
          files: dist/GroupILvlTooltip-${{ steps.package.outputs.version }}.zip
