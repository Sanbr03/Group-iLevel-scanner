name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package addon
        run: |
          mkdir -p dist/GroupILvlTooltip
          cp GroupILvlTooltip/GroupILvlTooltip.lua GroupILvlTooltip/GroupILvlTooltip.toc dist/GroupILvlTooltip/
          cd dist
          zip -r GroupILvlTooltip.zip GroupILvlTooltip

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          overwrite_files: true
          files: dist/GroupILvlTooltip.zip
